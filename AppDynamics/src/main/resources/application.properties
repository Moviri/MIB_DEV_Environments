spring.application.name=capital-lab
spring.profiles.active=${DEMO_ROLE:portal}
server.port=8080
server.shutdown=graceful
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/capital}
spring.datasource.username=${DB_USER:capital}
spring.datasource.password=${DB_PASSWORD:capital-local-only}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=10
spring.jackson.serialization.write-dates-as-timestamps=false
demo.failures-enabled=${DEMO_FAILURES_ENABLED:true}
demo.verification-url=${VERIFICATION_URL:http://verification:8080}
demo.processor-url=${PROCESSOR_URL:http://processor:8080}
demo.node=${APPDYNAMICS_AGENT_NODE_NAME:local}
logging.level.root=INFO
server.error.include-message=never
server.error.include-stacktrace=never
