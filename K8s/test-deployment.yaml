#####################################################################
# Create a namespace for the ETL test
#####################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: etl-test
  labels:
    purpose: etl-test
---
#####################################################################
# Local StorageClass + PVs for lab clusters with no CSI
#####################################################################
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-test
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: etl-local-pv-01
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-test
  local:
    path: /var/local/etl-pv/pv01
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - bc-24-11-f7-ef-d4
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: etl-local-pv-02
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-test
  local:
    path: /var/local/etl-pv/pv02
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - bc-24-11-f7-ef-d4
---
#####################################################################
# Create a StatefulSet for the ETL test
#####################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pvc-demo
  namespace: etl-test
spec:
  serviceName: pvc-demo
  replicas: 2
  selector:
    matchLabels:
      app: pvc-demo
  template:
    metadata:
      labels:
        app: pvc-demo
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sh","-c","echo hello > /data/hello.txt; sleep 360000"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-test
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
#####################################################################
# Create a Deployment for the ETL test
#####################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: res-demo
  namespace: etl-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: res-demo
  template:
    metadata:
      labels:
        app: res-demo
    spec:
      containers:
        - name: stress
          image: docker.io/polinux/stress-ng:latest
          args: ["--cpu", "1", "--vm", "1", "--vm-bytes", "200M", "--timeout", "0"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
#####################################################################
# Create a LimitRange for the ETL test
#####################################################################
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: etl-test
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: 1
        memory: 1Gi
    - type: Pod
      max:
        cpu: 3
        memory: 3Gi
---
#####################################################################
# Create a ResourceQuota for the ETL test
#####################################################################
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq
  namespace: etl-test
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    pods: "10"
    persistentvolumeclaims: "5"
    requests.storage: "10Gi"
---
#####################################################################
# Create a ConfigMap for the ETL test
#####################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: jmx-config
  namespace: etl-test
data:
  config.yaml: |
    startDelaySeconds: 0
    ssl: false
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: "java.lang<type=Memory><>(HeapMemoryUsage|NonHeapMemoryUsage)"
      - pattern: "java.lang<type=Threading><>ThreadCount"
---
#####################################################################
# Create a Deployment for the JMX test
#####################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmx-demo
  namespace: etl-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jmx-demo
  template:
    metadata:
      labels:
        app: jmx-demo
    spec:
      containers:
        - name: app
          image: docker.io/techiescamp/jmx-pet-clinic-app:latest
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 5556
          env:
            - name: LOGGING_FILE_NAME
              value: /tmp/petclinic.log
          volumeMounts:
            - name: jmx-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: varlog
              mountPath: /var/log
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jmx-config
          configMap:
            name: jmx-config
        - name: varlog
          emptyDir: {}
---
#####################################################################
# Create a Service for the JMX test
#####################################################################
apiVersion: v1
kind: Service
metadata:
  name: jmx-demo
  namespace: etl-test
  labels:
    app: jmx-demo
spec:
  selector:
    app: jmx-demo
  ports:
    - name: metrics
      port: 5556
      targetPort: metrics
---
#####################################################################
# Create a PodMonitor for the JMX test
#####################################################################
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: jmx-demo
  namespace: etl-test
spec:
  selector:
    matchLabels:
      app: jmx-demo
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
#####################################################################
# Create a HorizontalPodAutoscaler for the ETL test
#####################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: res-demo-hpa
  namespace: etl-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: res-demo
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
#####################################################################
# Create a PodDisruptionBudget for the ETL test
#####################################################################
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: res-demo-pdb
  namespace: etl-test
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: res-demo
---
#####################################################################
# Create a LimitRange for the ETL test
#####################################################################
apiVersion: v1
kind: LimitRange
metadata:
  name: storage-limits
  namespace: etl-test
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: 10Gi
      min:
        storage: 1Gi
      default:
        storage: 2Gi
      defaultRequest:
        storage: 2Gi